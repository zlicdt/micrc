[package]
name = "micrc"
version = "0.1.0"
edition = "2024"
description = "A terminal-native Minecraft launcher"
license = "MIT"

[dependencies]
anyhow = "1.0"
crossterm = "0.28"
futures-util = "0.3"
md-5 = "0.10"
ratatui = "0.29"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
tokio = { version = "1.49", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
temp-dir = "0.1"
